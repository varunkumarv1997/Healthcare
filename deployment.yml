---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeployment
spec:
  replicas: 2
  selector:
    matchLabels: 
      name: deployment
  template:
    metadata:
      name: test
      labels:
        name: deployment
    spec:
      containers:
        - name: healthcare-container
          image: varunv25/myimg1:latest
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: demoservice
spec:
  ports:
    - port: 8081
      targetPort: 8082
  selector:
    name: deployment
  type: Node port  
